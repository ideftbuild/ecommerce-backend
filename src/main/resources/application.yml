spring:
  application:
    name: Ecommerce Backend

  datasource:
    url: jdbc:postgresql://localhost:5000/ecommerce_db
    username: postgres
    password: password

#  thymeleaf:
#    cache: false


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

logging:
  level:
    org:
      springframework:
        security: DEBUG
