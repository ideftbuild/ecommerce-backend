spring:
  application:
    name: Ecommerce Backend

  datasource:
    url: jdbc:postgresql://localhost:5000/ecommerce_db
    username: postgres
    password: password

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
    org:
      springframework:
        security: DEBUG


file:
  upload-dir: uploads

jwt:
  secret: ${JWT_SECRET:}

